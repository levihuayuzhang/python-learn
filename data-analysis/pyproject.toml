[project]
name = "data-analysis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Huayu Zhang", email = "zhanghuayu.dev@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "jupyter>=1.1.1",
    "jupyterlab>=4.6.3",
    "matplotlib>=3.10.9",

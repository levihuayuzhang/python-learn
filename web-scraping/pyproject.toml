[project]
name = "web-scraping"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Huayu Zhang", email = "zhanghuayu.dev@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.3",
    "beautifulsoup4>=4.15.0",
    "jupyter>=1.1.1",
    "jupyterlab>=4.6.3",
    "lxml>=6.1.2",
    "notebook>=7.6.2",
    "requests>=2.34.2",
]

[project.scripts]
web-scraping = "web_scraping:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
